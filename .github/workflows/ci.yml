name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            uname: arm64
          - arch: x64
            runner: macos-15-intel
            uname: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.uname }}"
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run setup -- --config-only
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  validate-linux:
    name: validate (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install desktop bindings
        run: sudo apt-get update && sudo apt-get install -y zsh python3-gi python3-gi-cairo gir1.2-atspi-2.0 gir1.2-gtk-3.0
      - run: npm ci
      - run: npm run setup -- --config-only
      - run: npm run vendor:apply-patch:linux
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
